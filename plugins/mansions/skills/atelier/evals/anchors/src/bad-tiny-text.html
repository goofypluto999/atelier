<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../../assets/tokens.css">
<!-- Direction: ledger. Accounting paper: ruled columns, a running total, one teal pencil tick on the line that matters. -->
<style>
.lg { color: var(--ink); padding: 90px 84px; background: repeating-linear-gradient(to bottom, transparent 0 107px, #2e2c2826 107px 109px) 0 1031px / 100% 400px no-repeat, var(--paper); }
.lg { /* ruled ledger lines continue below the book, with the teal margin rule */ }
.lg h1 { font: 600 104px/0.98 var(--disp); letter-spacing: -0.035em; max-width: 880px; }
.lg h1 em { font-style: normal; color: var(--house); }
.book { position: absolute; left: 84px; right: 84px; top: 470px; border-top: 6px double var(--ink); }
.book .h, .book .r { display: grid; grid-template-columns: 170px 1fr 250px; align-items: end; }
.book .h { font: 700 15px/1 var(--body); font-stretch: 80%; letter-spacing: 0.08em; padding: 22px 0 16px; border-bottom: 3px solid var(--ink); }
.book .r { min-height: 70px; border-bottom: 2px solid #2e2c2840; padding: 0 0 18px; font: 400 19px/1.2 var(--body); }
.book .r .d { font: 500 16px/1.2 var(--mono); color: var(--ink-2); }
.book .r .n { text-align: right; font: 700 50px/1 var(--body); font-stretch: 112%; font-variant-numeric: tabular-nums; }
.book .t { border-top: 4px solid var(--ink); border-bottom: 6px double var(--ink); min-height: 130px; }
.book .t .n { font-size: 64px; color: var(--house); }
.tick { position: absolute; left: 40px; top: 44px; width: 76px; height: 54px; }
.margin { position: absolute; left: 84px; top: 470px; bottom: 0; }
.lg .fine { font-size: 15px; position: absolute; left: 84px; bottom: 50px; color: var(--ink-2); max-width: 720px; background: var(--paper); padding: 4px 0; }
.lg .logo { right: 84px; bottom: 52px; }
</style>
<section class="page lg" data-allow="gradient">
  <h1 data-role="hook">Where a month of reporting <em>really goes.</em></h1>
  <div class="mrule" style="position:absolute;left:250px;top:470px;bottom:0;width:3px;background:#07505555"></div>
  <div class="book">
    <div class="h"><span>WHEN</span><span>ITEM</span><span style="text-align:right">HOURS</span></div>
    <div class="r"><span class="d">day 1</span><span>Export numbers from six tools</span><span class="n">6</span></div>
    <div class="r"><span class="d">day 2</span><span>Clean, merge and check by hand</span><span class="n">9</span></div>
    <div class="r t" style="position:relative"><span class="d"></span><span>Every month, before anyone reads it</span><span class="n" data-role="number">15</span>
      <svg class="tick" viewBox="0 0 70 50"><path d="M6 26 L26 44 L64 6" fill="none" stroke="#075055" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
  <p class="fine" data-role="fine">Sample content and numbers. Replace with your facts.</p>
  <img class="logo" data-role="logo" src="../../../assets/brand/logo-lockup-dark.png" alt="The Mansions">
</section>
