<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../../assets/tokens.css">
<!-- Direction: receipt. A till roll on a dark ground: each step itemised, the total, the torn edge. For cost posts. -->
<style>
.rc { background: var(--night); color: var(--cream); }
.rc h1 { position: absolute; left: 70px; top: 90px; width: 440px; font: 600 86px/1.0 var(--disp); letter-spacing: -0.03em; }
.rc .side { position: absolute; left: 70px; top: 760px; width: 400px; font: 450 36px/1.32 var(--body); color: var(--cream-2); }
.roll { position: absolute; right: 70px; top: 0; width: 470px; height: 1180px; background: #f6f3ec; color: #1d1c1a; padding: 120px 40px 0;
  clip-path: polygon(0 0, 100% 0, 100% 97%, 96% 100%, 92% 97%, 88% 100%, 84% 97%, 80% 100%, 76% 97%, 72% 100%, 68% 97%, 64% 100%, 60% 97%, 56% 100%, 52% 97%, 48% 100%, 44% 97%, 40% 100%, 36% 97%, 32% 100%, 28% 97%, 24% 100%, 20% 97%, 16% 100%, 12% 97%, 8% 100%, 4% 97%, 0 100%);
  font: 500 30px/1.45 var(--mono); }
.roll .c { text-align: center; }
.roll .big { font: 800 40px/1.2 var(--body); font-stretch: 75%; letter-spacing: 0.04em; }
.roll hr { border: 0; border-top: 3px dashed #1d1c1a; margin: 26px 0; }
.roll .l { display: flex; justify-content: space-between; }
.roll .tot { font: 800 58px/1 var(--body); font-stretch: 80%; display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; }
.roll .tot span:last-child { background: var(--house); color: var(--cream); padding: 6px 12px; }
.roll .x { color: #6b675f; text-decoration: line-through; }
.rc .logo { left: 70px; bottom: 60px; }
</style>
<section class="page rc">
  <h1 data-role="hook">A receipt for one AI run.</h1>
  <p class="side">Want your AI costs this low? We help teams cut spend by 90%. Book your free audit today.</p>
  <div class="roll">
    <div class="c big">RUN #0412</div>
    <div class="c">one task, one model</div>
    <hr>
    <div class="l"><span>input tokens</span><span>48,200</span></div>
    <div class="l"><span>output tokens</span><span>3,900</span></div>
    <hr>
    <div class="l x"><span>retries</span><span>3</span></div>
    <div class="l x"><span>  retry cost</span><span>$0.19</span></div>
    <hr>
    <div class="l"><span>cache hits</span><span>71%</span></div>
    <div class="l"><span>tool calls</span><span>12</span></div>
    <hr>
    <div class="tot"><span>TOTAL</span><span data-role="number">$0.42</span></div>
    <div class="c" style="margin-top:40px">per run</div>
    <div class="c" style="margin-top:26px">sample numbers</div>
  </div>
  <img class="logo" data-role="logo" src="../../../assets/brand/logo-lockup-white.png" alt="The Mansions">
</section>
