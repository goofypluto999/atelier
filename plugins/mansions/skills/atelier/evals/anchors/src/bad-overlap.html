<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../../assets/tokens.css">
<!-- Direction: diff. A changelog: removed lines, added lines, a commit message in plain English. For rules we changed. -->
<style>
.df { background: var(--night); color: var(--cream); padding: 90px 70px; }
.df h1 { font: 600 90px/1.0 var(--disp); letter-spacing: -0.03em; max-width: 920px; }
.pane { position: absolute; left: 70px; right: 70px; top: 470px; background: var(--deep); border-radius: 12px; padding: 34px 0; font: 500 34px/1.6 var(--mono); }
.pane .hd { padding: 0 34px 22px; color: var(--steel); font-size: 28px; }
.ln { display: grid; grid-template-columns: 70px 1fr; padding: 4px 34px 4px 0; }
.ln b { text-align: center; font-weight: 700; }
.del { background: #ffffff0d; color: #9aa0a7; }
.del span { text-decoration: line-through; text-decoration-thickness: 2px; }
.add { background: #206b6f55; color: var(--glow); }
.ctx { color: var(--cream-2); }
.msg { position: absolute; left: 70px; right: 70px; top: 610px; font: 450 38px/1.3 var(--body); color: var(--cream-2); }
.msg b { color: var(--cream); font-weight: 650; }
.df .logo { right: 70px; bottom: 60px; }
</style>
<section class="page df">
  <h1 data-role="hook">One line moved. Approval sits on the merge now.</h1>
  <div class="pane" data-role="object">
    <div class="hd">release rule · v2.3</div>
    <div class="ln ctx"><b> </b><span>deploy:</span></div>
    <div class="ln del"><b>−</b><span>  sign-off: after the deploy</span></div>
    <div class="ln add"><b>+</b><span>  sign-off: on the merge, before it ships</span></div>
    <div class="ln add"><b>+</b><span>  source: the config file itself</span></div>
  </div>
  <p class="msg"><b>Why:</b> sample content. The merge is the step that ships, so the person signs there.</p>
  <img class="logo" data-role="logo" src="../../../assets/brand/logo-lockup-white.png" alt="The Mansions">
</section>
