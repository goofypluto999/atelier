<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../assets/tokens.css"><script src="../../assets/lib/motion.js"></script>
<!-- Worked example: "the-run", a 12 s film with sound (1080x1350). The words describe Atelier's own run; the sound bed and
     the effect cues are code-made sample sound. timeline.json times both: motion.mjs passes its beats to this page as
     window.TIMELINE, and sound.py places an effect on each beat. Frame 0 carries the hook; a marker drops down the rail
     to each stage on its beat (springs); the critic's stage lands heavier; PASS lands last, below the rail; final hold from about 9.4 s.
     Render: node ../../scripts/motion.mjs motion.html --sub 2 --poster 10, then python ../../scripts/sound.py . and
     python ../../scripts/video_check.py . (references/sound.md). -->
<style>
.page.run { width: 1080px; height: 1350px; background: var(--night); color: var(--cream); overflow: hidden; }
.run h1 { position: absolute; left: 96px; right: 96px; top: 96px; margin: 0; font: 650 104px/0.98 var(--disp); letter-spacing: -0.035em; }
.run .rail { position: absolute; left: 118px; top: 392px; width: 4px; height: 624px; background: var(--steel); }
.run .stop { position: absolute; left: 106px; width: 28px; height: 28px; margin-top: -14px; border-radius: 50%; background: var(--night); border: 4px solid var(--cream-2); box-sizing: border-box; }
.run .stage { position: absolute; left: 176px; right: 60px; margin-top: -36px; display: flex; align-items: baseline; gap: 26px; opacity: 0; }
.run .stage b { font: 700 60px/1.1 var(--body); font-stretch: 85%; }
.run .stage span { font: 500 38px/1.1 var(--body); color: var(--cream-2); }
.run .marker { position: absolute; left: 100px; top: 0; width: 40px; height: 40px; margin-top: -20px; border-radius: 50%; background: var(--teal-lit); }
.run .stamp { position: absolute; right: 96px; bottom: 124px; font: 800 150px/1 var(--body); font-stretch: 75%; color: var(--teal-lit); letter-spacing: 0.02em; opacity: 0; }
.run .fine { position: absolute; left: 96px; bottom: 56px; font: 500 36px/1.2 var(--body); color: var(--cream-2); }
</style>
<section class="page run">
  <h1 data-role="hook" data-read="hook">Brief in. Checked film out.</h1>
  <div class="rail"></div>
  <div id="stages"></div>
  <div class="marker" data-role="accent"></div>
  <div class="stamp" data-role="number" data-read="pass">PASS</div>
  <div class="fine" data-role="fine" data-read="fine">Sound: code-made sample bed and cues.</div>
</section>
<script>
// The seven stages of a run, in order; each lands on the beat of the same id in timeline.json.
const STAGES = [["brief", "Brief", "one idea, swap-tested"], ["direction", "Direction", "dealt, not picked"],
  ["render", "Render", "HTML to pixels"], ["checks", "Checks", "scripts measure pixels"], ["critic", "Critic", "another agent judges"],
  ["revision", "Revision", "fix the worst three"], ["memory", "Memory", "the next piece differs"]];
const at = Object.fromEntries(((window.TIMELINE || {}).beats || []).map((b) => [b.id, Number(b.at)]));
const Y = (i) => 410 + i * 98;
const box = document.getElementById("stages"), page = document.querySelector("section.page");
STAGES.forEach(([id, name, note], i) => {
  const stop = document.createElement("div");
  stop.className = "stop"; stop.style.top = `${Y(i)}px`; stop.id = `stop-${id}`;
  const row = document.createElement("div");
  row.className = "stage"; row.style.top = `${Y(i)}px`; row.id = `row-${id}`; row.dataset.read = id;
  row.innerHTML = `<b>${name}</b><span>${note}</span>`;
  page.insertBefore(stop, box); page.insertBefore(row, box);
});
const marker = document.querySelector(".marker"), stamp = document.querySelector(".stamp");
window.seek = (t) => {
  // the marker: one spring per stage, from the top of the rail; the critic's drop is softer and heavier
  const keys = [[0, 362]];
  STAGES.forEach(([id], i) => keys.push([at[id] ?? 0, Y(i)]));
  marker.style.top = `${M.track(t, keys, 170, 24).toFixed(1)}px`;
  STAGES.forEach(([id], i) => {
    const heavy = id === "critic";
    const p = M.spring(t - (at[id] ?? 0), heavy ? 120 : 260, heavy ? 14 : 26);
    const row = document.getElementById(`row-${id}`);
    row.style.opacity = M.clamp(p * 1.6).toFixed(3);
    row.style.transform = `translateX(${((1 - p) * (heavy ? 60 : 28)).toFixed(1)}px)`;
    const s = document.getElementById(`stop-${id}`);
    s.style.borderColor = t >= (at[id] ?? 0) ? "var(--cream)" : "var(--cream-2)";
    s.style.background = t >= (at[id] ?? 0) ? "var(--cream)" : "var(--night)";
  });
  const q = M.spring(t - (at.pass ?? 0), 200, 18);
  stamp.style.opacity = M.clamp(q * 2).toFixed(3);
  stamp.style.transform = `scale(${(1.25 - 0.25 * q).toFixed(3)}) rotate(-4deg)`;
};
window.seek(0);
</script>
