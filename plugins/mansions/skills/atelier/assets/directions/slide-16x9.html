<!-- Format: a 16:9 slide (1920x1080). Render with --size 1920x1080. One claim, its proof, its source.
     Body 48 px and fine print 32 px: the slide floors deck_check.py measures (references/slides.md). -->
<style>
.page.sl169 { width: 1920px; height: 1080px; background: var(--paper); color: var(--ink); }
.sl169 h1 { position: absolute; left: 120px; top: 110px; width: 900px; font: 650 112px/0.98 var(--disp); letter-spacing: -0.035em; text-wrap: balance; }
.sl169 .n { position: absolute; right: 120px; top: 60px; font: 900 620px/0.82 var(--body); font-stretch: 62%; color: var(--house); }
.sl169 p.body { position: absolute; left: 120px; top: 560px; width: 760px; font: 450 48px/1.3 var(--body); color: var(--ink-2); }
.sl169 .fine { position: absolute; left: 120px; bottom: 70px; font-size: 32px; color: var(--ink-2); }
.sl169 .logo { right: 120px; bottom: 66px; }
</style>
<section class="page sl169">
  <h1 data-role="hook">Seven of&nbsp;twelve steps are&nbsp;copying.</h1>
  <div class="n" data-role="number">7</div>
  <p class="body">Between an order and its invoice, most of the work is a person moving a number from one screen to another.</p>
  <p class="fine" data-role="fine">Sample content and numbers.</p>
  <img class="logo" data-role="logo" src="data:," alt=""><!-- logo slot, empty by default: compose.py scaffold points it at the brand file's --logo, or removes it -->
</section>
