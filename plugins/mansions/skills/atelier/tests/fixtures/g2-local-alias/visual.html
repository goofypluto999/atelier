<!-- Test fixture (tests/fixtures/g2-local-alias): a page font declared with @font-face under its own family name, whose source is an installed
     system font (local()). The platform reports the system font's name, not the alias, and render.mjs --audit used to call that
     "falls back to Arial" and stop. A family declared by an @font-face rule that loaded is declared: it must not raise the fallback FAIL.
     Several local() names, so it resolves on Windows, macOS and Linux. -->
<style>
@font-face { font-family: "Atelier Alias"; src: local("Arial"), local("Helvetica"), local("Liberation Sans"), local("DejaVu Sans"); }
.lg { color: var(--ink); padding: 90px 84px; background: var(--paper); }
.lg h1 { font: 600 104px/0.98 "Atelier Alias", sans-serif; letter-spacing: -0.035em; max-width: 880px; }
.lg p.body { position: absolute; left: 84px; top: 520px; font: 400 44px/1.3 "Atelier Alias", sans-serif; max-width: 800px; }
.lg .fine { position: absolute; left: 84px; bottom: 50px; color: var(--ink-2); }
</style>
<section class="page lg">
  <h1 data-role="hook">Where a month of reporting goes.</h1>
  <p class="body">Export numbers from six tools.</p>
  <p class="fine" data-role="fine">Sample content and numbers. Replace with your facts.</p>
</section>
