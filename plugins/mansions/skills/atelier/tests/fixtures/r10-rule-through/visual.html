<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../../assets/tokens.css">
<!-- Test fixture (tests/fixtures/r10-rule-through): two rules run through text. The rows of the table are fixed at 60 px, so the two-line
     cell overflows and the next row's top border crosses its second line; a 4 px bar drawn as a div crosses the note. The audit fails on both. -->
<style>
.rt { background: var(--paper); color: var(--ink); padding: 90px 80px; }
.rt h1 { font: 650 110px/0.98 var(--disp); letter-spacing: -0.03em; }
.rt table { position: absolute; left: 80px; top: 420px; width: 560px; border-collapse: collapse; font: 450 40px/1.2 var(--body); }
.rt td { height: 60px; padding: 0; vertical-align: top; border-top: 4px solid var(--ink); }
.rt td div { height: 56px; overflow: visible; }
.rt tr + tr td { padding-top: 64px; }
.rt .note { position: absolute; left: 80px; top: 900px; font: 450 40px/1.3 var(--body); }
.rt .bar { position: absolute; left: 260px; top: 922px; width: 420px; height: 4px; background: var(--ink); }
.rt .fine { position: absolute; left: 80px; bottom: 54px; font-size: 32px; }
</style>
<section class="page rt">
  <h1 data-role="hook">Rules through&nbsp;text.</h1>
  <table><tr><td><div>A cell that runs to a second line under the rule</div></td></tr><tr><td><div>The next row</div></td></tr></table>
  <p class="note">A note with a bar through it.</p>
  <div class="bar"></div>
  <p class="fine" data-role="fine">Sample content.</p>
</section>
