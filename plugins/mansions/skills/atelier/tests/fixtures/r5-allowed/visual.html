<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../../assets/tokens.css">
<!-- Test fixture (tests/fixtures/r5-allowed): the same habits as r5-chrome, r5-pills, r5-nested and r5-rawcolour, each marked as deliberate with data-allow ("chrome", "pill", "nested", "colour"). render.mjs --audit must exit 0 and print none of those four warnings (later checks, such as display line breaks and phone read, add their own). tests/test_composer.py r12 asserts it. -->
<style>
.al { background: var(--paper); color: var(--ink); padding: 90px 84px; }
.al h1 { font: 600 96px/1.02 var(--disp); letter-spacing: -0.03em; max-width: 880px; }
.al .row { display: flex; align-items: center; gap: 14px; margin-top: 40px; font: 600 38px/1.2 var(--body); }
.al .row i { width: 22px; height: 22px; border-radius: 50%; display: block; }
.al .row i:nth-child(1) { background: #ff5f57; }
.al .row i:nth-child(2) { background: #febc2e; }
.al .row i:nth-child(3) { background: #28c840; }
.al .badge { background: var(--house); color: var(--cream); padding: 6px 18px; font: 700 34px/1.2 var(--body); }
.al .chip { border-radius: 999px; background: var(--paper-2); padding: 8px 28px; font: 500 36px/1.3 var(--body); }
.al .a { margin-top: 40px; padding: 28px; background: var(--paper-2); font: 500 36px/1.3 var(--body); }
.al .b { margin-top: 20px; padding: 24px; border: 4px solid var(--ink); }
.al .c { margin-top: 16px; padding: 18px 24px; background: var(--house); color: var(--cream); font: 600 38px/1.25 var(--body); }
.al .m1 { color: #5c4300; } .al .m2 { color: #7a2306; } .al .m3 { color: #8a1414; } .al .m4 { color: #6e143f; }
.al .m5 { color: #353b8a; } .al .m6 { color: #17462b; } .al .m7 { color: #08405f; } .al .m8 { color: #4a2470; }
.al .fine { position: absolute; left: 84px; bottom: 54px; color: var(--ink-2); }
</style>
<section class="page al">
  <h1 data-role="hook">Deliberate, and marked.</h1>
  <div data-allow="chrome">
    <div class="row"><i></i><i></i><i></i></div>
    <div class="row"><span class="badge">NEW</span></div>
  </div>
  <div class="row" data-allow="pill"><span class="chip">Strategy</span><span class="chip">Design</span><span class="chip">Build</span><span class="chip">Ship</span></div>
  <div class="a">The outer box.
    <div class="b">The middle box.
      <div class="c" data-allow="nested">The inner box, marked.</div>
    </div>
  </div>
  <div class="row" data-allow="colour"><span class="m1">One</span><span class="m2">Two</span><span class="m3">Three</span><span class="m4">Four</span><span class="m5">Five</span><span class="m6">Six</span><span class="m7">Seven</span><span class="m8" style="background:#f0e6ff">Eight</span></div>
  <p class="fine" data-role="fine">Sample content.</p>
</section>
