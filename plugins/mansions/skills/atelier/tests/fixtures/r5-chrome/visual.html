<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../../assets/tokens.css">
<!-- Test fixture (tests/fixtures/r5-chrome): fake product chrome on a social image. A row of red, amber and green window dots; a "live" dot (pseudo-element) and an "online" dot (element) beside status words; a NEW badge in a box. render.mjs --audit must exit 0 (no hard fail) and print these three warnings (later checks add their own; tests/test_composer.py r12 asserts these): "fake product chrome: 1 row(s) of red, amber and green dots", "fake product chrome: a status dot beside", "fake product chrome: "NEW" in a pill or box". -->
<style>
.ch { background: var(--paper); color: var(--ink); padding: 90px 84px; }
.ch h1 { font: 600 96px/1.02 var(--disp); letter-spacing: -0.03em; max-width: 880px; }
.win { margin-top: 70px; border: 4px solid var(--ink); }
.bar { display: flex; gap: 14px; padding: 18px 22px; border-bottom: 4px solid var(--ink); }
.bar i { width: 22px; height: 22px; border-radius: 50%; display: block; }
.bar i:nth-child(1) { background: #ff5f57; }
.bar i:nth-child(2) { background: #febc2e; }
.bar i:nth-child(3) { background: #28c840; }
.live { display: flex; align-items: center; gap: 14px; margin: 40px 30px 0; font: 600 40px/1.2 var(--body); }
.live::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--house); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
.on { display: flex; align-items: center; gap: 14px; margin: 24px 30px 0; font: 600 40px/1.2 var(--body); }
.on .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--teal); }
.badge { display: inline-block; margin: 40px 30px 40px; background: var(--house); color: var(--cream); padding: 6px 18px; font: 700 34px/1.2 var(--body); }
.ch .fine { position: absolute; left: 84px; bottom: 54px; color: var(--ink-2); }
</style>
<section class="page ch">
  <h1 data-role="hook">Reports that build themselves.</h1>
  <div class="win">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="live">Live now</div>
    <div class="on"><span class="dot"></span><span>Online</span></div>
    <span class="badge">NEW</span>
  </div>
  <p class="fine" data-role="fine">Sample content.</p>
</section>
