<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../../assets/tokens.css">
<!-- Test fixture (tests/fixtures/r10-rule-clear): rules that sit beside text, never through it. A ruled table whose rows fit their text,
     a word underlined with a border, a heading with a double rule above it, and a label set on a rule with an opaque ground behind it.
     The audit passes with no rule-through-text fail. -->
<style>
.rc { background: var(--paper); color: var(--ink); padding: 90px 80px; }
.rc h1 { font: 650 110px/0.98 var(--disp); letter-spacing: -0.03em; border-top: 8px double var(--ink); padding-top: 24px; }
.rc table { position: absolute; left: 80px; top: 420px; width: 920px; border-collapse: collapse; font: 450 40px/1.2 var(--body); }
.rc th, .rc td { text-align: left; padding: 20px 0; border-bottom: 2px solid var(--ink); }
.rc th { border-bottom: 4px solid var(--ink); font-weight: 700; }
.rc u { text-decoration: none; border-bottom: 4px solid var(--ink); }
.rc .line { position: absolute; left: 80px; right: 80px; top: 880px; height: 4px; background: var(--ink); }
.rc .lab { position: absolute; left: 400px; top: 856px; padding: 0 20px; background: var(--paper); font: 450 40px/1.3 var(--body); }
.rc .fine { position: absolute; left: 80px; bottom: 54px; font-size: 32px; }
</style>
<section class="page rc">
  <h1 data-role="hook">Rules beside&nbsp;text.</h1>
  <table><tr><th>step</th><th>owner</th></tr><tr><td>Write the <u>rollback</u></td><td>one person</td></tr><tr><td>Try it on staging</td><td>the same person</td></tr></table>
  <div class="line"></div><p class="lab">a label on a rule</p>
  <p class="fine" data-role="fine">Sample content.</p>
</section>
