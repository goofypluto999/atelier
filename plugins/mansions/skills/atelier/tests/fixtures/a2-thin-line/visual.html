<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../../assets/tokens.css">
<!-- Test fixture (tests/fixtures/a2-thin-line): a 540px numeral and a 9px full-width accent line. The line is the sharpest, most saturated mark on the page but has almost no area. The old 95th percentile score put it above the numeral. attention.py must PASS this cover: the number wins by how much of the page it holds. -->
<style>
.tl { background: var(--paper); color: var(--ink); padding: 90px 84px; }
.tl h1 { font: 600 72px/1.05 var(--disp); letter-spacing: -0.03em; max-width: 480px; }
.tl .n { position: absolute; left: 70px; top: 300px; font: 900 540px/0.9 var(--body); font-stretch: 70%; letter-spacing: -0.02em; }
.tl .rule { position: absolute; left: 0; right: 0; top: 960px; height: 9px; background: var(--teal); }
.tl .s { position: absolute; left: 84px; top: 1030px; font: 450 38px/1.3 var(--body); color: var(--ink-2); max-width: 700px; }
.tl .fine { position: absolute; left: 84px; bottom: 54px; color: var(--ink-2); }
</style>
<section class="page tl">
  <h1 data-role="hook">Hours of reporting, every month.</h1>
  <div class="n" data-role="number">15</div>
  <div class="rule" data-role="accent"></div>
  <p class="s" data-role="body">Export, chase, clean, merge, check.</p>
  <p class="fine" data-role="fine">Sample content and numbers.</p>
</section>
